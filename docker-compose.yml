# Local stack: self-hosted Convex (backend + dashboard) and n8n on one network,
# so Convex actions can reach http://n8n:5678 and n8n can reach http://backend:3211
# without a public tunnel. Secrets are read from ./.env (gitignored; see .env.example).
name: lendloop

services:
  backend:
    image: ghcr.io/convex/convex-backend@sha256:6644f704e3a22444d5e166c3071a97be429915db962b38d1df1776876b102320
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:3210:3210" # client API (NEXT_PUBLIC_CONVEX_URL)
      - "127.0.0.1:3211:3211" # HTTP actions (/n8n/*)
    volumes:
      - convex-data:/convex/data
    environment:
      - INSTANCE_NAME=lendloop-local
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - DISABLE_BEACON=true
      - DOCUMENT_RETENTION_DELAY=172800
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/convex/convex-dashboard@sha256:3cabc039ab4b4e3a75cc02338b6c70f37f5c0c356e1b79499151b43ec8d83e34
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
    depends_on:
      backend:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.6
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      # Workflows read HMAC secrets via $env so they never land in exported JSON (SR-7).
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - LENDLOOP_N8N_HMAC_SECRET=${LENDLOOP_N8N_HMAC_SECRET:?set in .env}
      - LENDLOOP_CONVEX_HMAC_SECRET=${LENDLOOP_CONVEX_HMAC_SECRET:?set in .env}
      - CONVEX_HTTP_URL=http://backend:3211
      # Data minimization (SR-9): keep failed runs for debugging, drop successful ones, prune old data.
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false

volumes:
  convex-data:
  n8n-data:
